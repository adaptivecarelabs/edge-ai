name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest

  clinical-ai-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinical-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clinical-ai/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
