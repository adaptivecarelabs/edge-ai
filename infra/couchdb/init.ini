; Dev-only single-node CouchDB config. Databases (patients, encounters,
; consent, triage, sync-meta) and RBAC roles are created by provision.sh,
; not here.
;
; Mounted into /opt/couchdb/etc/default.d/ (not local.d/) so CouchDB never
; persists runtime state (admin password hash, node uuid) back into this
; repo-tracked file.
[couchdb]
single_node = true

[chttpd]
bind_address = 0.0.0.0
